       the <g> below, then rsvg-convert -z 2 assets/cover.svg -o assets/cover.png -->
  <rect width="1280" height="720" fill="#11111b"/>

  <!-- Left: name, pitch, install -->
  <g font-family="Maple Mono NF, Menlo, monospace">
    <text x="72" y="250" font-size="78" font-weight="700" fill="#cdd6f4">pi-tidy</text>
    <rect x="74" y="274" width="64" height="5" rx="2.5" fill="#89dceb"/>

