<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- pi-tidy cover — catppuccin mocha. Rendered to cover.png with rsvg-convert. -->
  <rect width="1280" height="640" fill="#11111b"/>

  <!-- Left: name, pitch, install -->
  <g font-family="Maple Mono NF, Menlo, monospace">
    <text x="72" y="196" font-size="78" font-weight="700" fill="#cdd6f4">pi-tidy</text>
    <rect x="74" y="220" width="64" height="5" rx="2.5" fill="#89dceb"/>

    <text x="72" y="282" font-size="25" fill="#cdd6f4">Claude Code-style tool</text>
    <text x="72" y="316" font-size="25" fill="#cdd6f4">folding for the pi agent</text>

    <g font-size="18" fill="#a6adc8">
      <text x="72" y="382"><tspan fill="#89dceb">▸</tspan>  tool calls fold into one line</text>
      <text x="72" y="414"><tspan fill="#a6e3a1">✓</tspan>  click it open, row by row</text>
      <text x="72" y="446"><tspan fill="#f38ba8">✗</tspan>  failures and edits stay visible</text>
      <text x="72" y="478"><tspan fill="#89dceb">◐</tspan>  background jobs tracked live</text>
    </g>

    <rect x="72" y="526" width="300" height="44" rx="10" fill="#1e1e2e" stroke="#313244"/>
    <text x="92" y="554" font-size="18" fill="#6c7086">$ <tspan fill="#cdd6f4">pi install npm:pi-tidy</tspan></text>
  </g>

  <!-- Right: the transcript, folded -->
  <rect x="520" y="96" width="700" height="460" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="1.5"/>
  <line x1="520" y1="138" x2="1220" y2="138" stroke="#313244" stroke-width="1.5"/>
  <circle cx="548" cy="117" r="6" fill="#45475a"/>
  <circle cx="570" cy="117" r="6" fill="#45475a"/>
  <circle cx="592" cy="117" r="6" fill="#45475a"/>
  <text x="870" y="123" font-family="Maple Mono NF, Menlo, monospace" font-size="14" fill="#6c7086" text-anchor="middle">~/app — pi</text>

  <g font-family="Maple Mono NF, Menlo, monospace" font-size="17" xml:space="preserve">
    <text x="548" y="182" fill="#cdd6f4">Checking the build first.</text>

    <text x="548" y="220"><tspan fill="#89dceb">▸</tspan> <tspan fill="#cdd6f4" font-weight="700">6 calls</tspan><tspan fill="#6c7086"> · bash×4  read×2 · </tspan><tspan fill="#f38ba8">1 failed</tspan><tspan fill="#6c7086"> · 2.4s</tspan></text>
    <text x="548" y="250"><tspan fill="#45475a">│</tspan> <tspan fill="#f38ba8">✗</tspan> <tspan fill="#89b4fa">bash</tspan><tspan fill="#a6adc8"> pnpm test  </tspan><tspan fill="#f38ba8">exit 1</tspan><tspan fill="#6c7086"> · 1.8s</tspan></text>
  </g>

  <!-- The edit keeps its box: its diff is the point -->
  <rect x="548" y="276" width="644" height="112" rx="10" fill="none" stroke="#cba6f7" stroke-width="1.5"/>
  <g font-family="Maple Mono NF, Menlo, monospace" font-size="16" xml:space="preserve">
    <text x="568" y="306" fill="#89b4fa">src/retry.ts</text>
    <rect x="566" y="320" width="300" height="24" rx="4" fill="#f38ba8" fill-opacity="0.16"/>
    <text x="572" y="338"><tspan fill="#f38ba8">-12</tspan><tspan fill="#cdd6f4">  const retries = 3;</tspan></text>
    <rect x="566" y="350" width="300" height="24" rx="4" fill="#a6e3a1" fill-opacity="0.16"/>
    <text x="572" y="368"><tspan fill="#a6e3a1">+12</tspan><tspan fill="#cdd6f4">  const retries = 5;</tspan></text>
  </g>

  <g font-family="Maple Mono NF, Menlo, monospace" font-size="17" xml:space="preserve">
    <text x="548" y="428"><tspan fill="#89dceb">▸</tspan> <tspan fill="#cdd6f4" font-weight="700">2 calls</tspan><tspan fill="#6c7086"> · bash×1  process×1 · </tspan><tspan fill="#89dceb">◐ 1 running</tspan></text>
    <text x="548" y="458"><tspan fill="#45475a">│</tspan> <tspan fill="#89dceb">◐</tspan> <tspan fill="#89b4fa">process</tspan><tspan fill="#a6adc8"> dev-server  </tspan><tspan fill="#f9e2af">running 42s · ready matched</tspan></text>

    <text x="548" y="506" fill="#cdd6f4">Server is up. Tests pass.</text>
  </g>
</svg>
