<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- pi-tidy cover — catppuccin mocha, 16:9. The diff block is generated from
       the real renderSplitDiff() output by scripts/gen-cover-diff.mts, then
       pasted in; do not hand-edit its columns.

